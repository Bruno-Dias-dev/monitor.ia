<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet"  href="chat.css">
</head>

<body>
<div class="d-flex">

  <!-- Sidebar -->
  <nav class="sidebar text-dark p-3" style="width: 250px">

    <img class="mb-4" src="/img/Monitor.ia.svg" width="180px">

    <ul class="nav nav-pills flex-column">

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="dashboard.html">
          Métricas omnichannel
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="#">
          Contemplados
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark  actived" href="chat.html">
          Chat
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="#">
          Gravações
        </a>
      </li>

    </ul>

  </nav>

  <!-- Conteúdo -->
<main class="d-flex flex-column justify-content-end align-items-center vh-100 flex-grow-1">

  <div class="input-group w-75 mb-3">

      <label for="arquivo" class="btn btn-light border">
          +
      </label>

      <input
          id="arquivo"
          type="file"
          hidden
          accept=".pdf,.doc,.docx,audio/*">

      <input
          type="text"
          class="form-control"
          placeholder="Faça sua análise agora">
      <button id="enviar" class="btn btn-primary">
        ➤
      </button>

    </div>

</main>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/script/chat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
