services:
  backend:
    image: ${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME}/${BACKEND_IMAGE:-monitor-ia-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env

  web:
    image: ${DOCKERHUB_USERNAME:?Defina DOCKERHUB_USERNAME}/${WEB_IMAGE:-monitor-ia-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
