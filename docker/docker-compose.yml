services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5500:80"

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - login
      - dashboard
      - ia
      - avaliacoes
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  avaliacoes:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5001 --workers 2 --timeout 120 app:app
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      DB_PORT2: ${DB_PORT2:-3306}
    depends_on:
      mysql:
        condition: service_healthy

  ia:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5001 --workers 1 --timeout 180 ia:app
    env_file: .env

  login:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 login:app
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 dadosomni:app
    env_file: .env

volumes:
  mysql_data:
