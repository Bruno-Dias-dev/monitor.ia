services:
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/monitor-ia-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env

  web:
    image: ${DOCKERHUB_USERNAME:-local}/monitor-ia-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
