<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet"  href="../css/chat.css">
</head>

<body>
<div class="d-flex">

  <!-- Sidebar -->
  <nav class="sidebar text-dark p-3" style="width: 250px">

    <img class="mb-4" src="../assets/img/Monitor.ia.svg" width="180px">

    <ul class="nav nav-pills flex-column">

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="dashboard.html">
          Métricas omnichannel
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="contemplados.html">
          Contemplados
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark actived" href="chat.html">
          Chat
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="analises.html">
          Análises
        </a>
      </li>

    </ul>

  </nav>

  <!-- Conteúdo -->
<main class="d-flex flex-column justify-content-end align-items-center vh-100 flex-grow-1">

  <!-- Área do chat-->
  <div id="chatMessages" class="chat-messages flex-grow-1">

    <div id="alert" class="alert alert-danger d-none my-3" role="alert">
      Erro no envio!
    </div>

  </div>
  <section id="caixaResposta" class="dvtnc d-none" aria-labelledby="tituloAnalises">
    <div class="caixaDeReposta">
      <h2 id="tituloAnalises" class="h6 mb-3">Análises realizadas</h2>
      <div class="table-responsive analysis-table-scroll">
        <table class="table table-hover align-middle analysis-table">
          <thead><tr>
            <th scope="col">Nome do arquivo</th><th scope="col">Data</th>
            <th scope="col">Contemplado</th><th scope="col">Beneficiário</th>
            <th scope="col">Notas</th><th scope="col">Score</th>
            <th scope="col">Classificação</th><th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr></thead>
          <tbody id="corpoAnalises"><tr id="estadoAnalises"><td colspan="8" class="text-center text-secondary">Envie um áudio para ver a análise aqui.</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
  <div class="divfdp d-flex">
    <div id="caixaEnvio" class="caixaMensagemEnviada d-none">
      <div id="arquivoResposta">
        <img id="fotinha"  src="../img/musicico.webp">
      </div>
      <div id="statusArquivoResposta">
        Arquivo enviado
      </div>
      <div id="nomeArquivoResposta">
        Nome
      </div>
    </div>
  </div>
  <div class="chat-composer mb-4">
    <form id="iaForm">

      <label for="arquivo" class="file-picker">
        <span class="file-picker-icon" aria-hidden="true">+</span>

        <span class="file-picker-text">
          <strong>Anexar arquivo</strong>
          <small id="arquivoNome">Áudio</small>
        </span>
      </label>

      <input
        id="arquivo"
        type="file"
        hidden
        accept="audio/*">

      <button id="enviar" class="send-button" type="button" aria-label="Enviar arquivo">
        ➤
      </button>

    </form>
  </div>

</main>

</div>
<div class="modal fade" id="analiseModal" tabindex="-1" aria-labelledby="analiseModalTitulo" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="analiseModalTitulo">Análise completa</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
    <div class="modal-body"><pre id="analiseCompleta" class="analysis-json mb-0"></pre></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../script/chat.js"></script>
</body>
</html>
