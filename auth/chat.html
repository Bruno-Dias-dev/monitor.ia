<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet"  href="../css/chat.css">
</head>

<body>
<div class="d-flex">

  <!-- Sidebar -->
  <nav class="sidebar text-dark p-3" style="width: 250px">

    <img class="mb-4" src="../assets/img/Monitor.ia.svg" width="180px">

    <ul class="nav nav-pills flex-column">

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="dashboard.html">
          Métricas omnichannel
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="contemplados.html">
          Contemplados
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark actived" href="chat.html">
          Chat
        </a>
      </li>

      <li class="nav-item mb-2">
        <a class="nav-link text-dark" href="analises.html">
          Análises
        </a>
      </li>

    </ul>

  </nav>

  <!-- Conteúdo -->
<main class="d-flex flex-column justify-content-end align-items-center vh-100 flex-grow-1">

  <!-- Área do chat-->
  <div id="chatMessages" class="chat-messages flex-grow-1">


    <div id="alert" class="alert alert-danger d-none" role="alert">
      Erro no envio!
    </div>

  </div>

  <div class="chat-composer mb-4">
    <form id="iaForm">

      <label for="arquivo" class="file-picker">
        <span class="file-picker-icon" aria-hidden="true">+</span>

        <span class="file-picker-text">
          <strong>Anexar arquivo</strong>
          <small id="arquivoNome">Áudio</small>
        </span>
      </label>

      <input
        id="arquivo"
        type="file"
        hidden
        accept="audio/*">

      <button id="enviar" class="send-button" type="submit" aria-label="Enviar arquivo">
        ➤
      </button>

    </form>
  </div>

</main>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../script/chat.js"></script>
</body>
</html>
